name: Build APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "releases_apk/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Servidor Go + APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout da revisão exata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Fonte limpa e versão única
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          cat version.properties
          grep -q '^versionName=1\.4\.4$' version.properties
          grep -q '^versionCode=19$' version.properties

      - name: "Servidor: vet, testes e self-tests"
        working-directory: server
        run: |
          set -euo pipefail
          check() {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              echo "::error title=${name} falhou::$(tail -c 3000 "/tmp/${name}.log" | tr '\n' ' ')"
              tail -80 "/tmp/${name}.log"
              exit 1
            fi
            tail -5 "/tmp/${name}.log"
          }
          check go-vet go vet ./...
          check go-test go test ./... -count=1
          cp /tmp/go-test.log /tmp/go-test.log.keep
          check go-evidence go test -v -count=1 -run 'TestGeneration|TestLevelDat|TestValidateWorld|TestAvatar|TestSkinExport|TestNbtSkip|TestTransportSummary|TestClampViewDistance' .
          check build-host python3 ../scripts/build-server.py ../build/mobosrv --host
          ../build/mobosrv -version | tee /tmp/go-version.txt
          check selftest-19132 ../build/mobosrv -selftest -port 19132
          check selftest-19555 ../build/mobosrv -selftest -port 19555
          check selftest-raknet ../build/mobosrv -selftest -port 19134 -raknet
          check selftest-tunnel ../build/mobosrv -selftest -port 19136 -raknet -selftest-tunnel

      - name: "Servidor: compilar ARM64 da mesma revisão"
        run: |
          set -euo pipefail
          rm -f android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so
          python3 scripts/build-server.py android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so
          file android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so | tee /tmp/server-sha256.txt

      - name: "Servidor: validar ELF Android"
        run: |
          set -euo pipefail
          SO=android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so
          python3 - "$SO" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          e_type, = struct.unpack_from("<H", data, 16)
          e_machine, = struct.unpack_from("<H", data, 18)
          e_phoff, = struct.unpack_from("<Q", data, 32)
          e_phentsize, e_phnum = struct.unpack_from("<HH", data, 54)
          interp = None; needed = []; tls_align = None
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type, = struct.unpack_from("<I", data, off)
              p_offset, = struct.unpack_from("<Q", data, off + 8)
              p_filesz, = struct.unpack_from("<Q", data, off + 32)
              if p_type == 3:
                  interp = data[p_offset:p_offset + p_filesz].split(b"\0")[0].decode()
              if p_type == 7:
                  tls_align, = struct.unpack_from("<Q", data, off + 48)
              if p_type == 2:
                  for j in range(p_offset, p_offset + p_filesz, 16):
                      tag, val = struct.unpack_from("<qQ", data, j)
                      if tag == 0: break
                      if tag == 1: needed.append(val)
          if e_type != 3 or e_machine != 183: sys.exit("ELF não é PIE aarch64")
          if interp != "/system/bin/linker64": sys.exit(f"interpretador errado: {interp!r}")
          if needed: sys.exit("binário com dependências dinâmicas")
          if tls_align is not None and tls_align < 64: sys.exit(f"PT_TLS alinhamento {tls_align} < 64")
          print("ELF ok: PIE aarch64, linker64, TLS", tls_align)
          PY
          REVISION="$(git rev-parse HEAD)"
          grep -a -q "$REVISION" "$SO"
          echo "Revisão presente no binário: $REVISION"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Garantir Android SDK 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi
          test -d "$SDK/platforms/android-35"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/aapt"

      - name: Instalar Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Testes de lógica do app (JVM)
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon testReleaseUnitTest | tee /tmp/gradle-unit.log
          {
            echo "== Testes JVM do app =="
            for xml in app/build/test-results/testReleaseUnitTest/*.xml; do
              [ -f "$xml" ] || continue
              sed -nE 's/.*<testsuite name="([^"]+)" tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1: \2 teste(s), \4 falha(s), \5 erro(s)/p' "$xml"
            done
          } | tee /tmp/jvm-evidence.txt

      - name: Compilar Kotlin debug (demo de interface)
        working-directory: android
        run: gradle --no-daemon compileDebugKotlin

      - name: Compilar APK release
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease | tee /tmp/gradle.log

      - name: Verificar APK (assinatura, package, versão, ARM64, revisão)
        id: verify
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.moboserver.app'" /tmp/badging.txt
          grep -q "versionName='1.4.4'" /tmp/badging.txt
          grep -q "versionCode='19'" /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmobosrv.so"
          mkdir -p /tmp/apk-lib
          unzip -p "$APK" lib/arm64-v8a/libmobosrv.so > /tmp/apk-lib/libmobosrv.so
          BUILT_SHA="$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so | cut -d' ' -f1)"
          APK_SHA="$(sha256sum /tmp/apk-lib/libmobosrv.so | cut -d' ' -f1)"
          test "$BUILT_SHA" = "$APK_SHA"
          REVISION="$(git rev-parse HEAD)"
          grep -a -q "$REVISION" /tmp/apk-lib/libmobosrv.so
          # Mesma chave de assinatura da entrega anterior (não trocar identidade).
          OLDZIP=releases_apk/MoboServer-v1.4.3-android-arm64.zip
          if [ -f "$OLDZIP" ]; then
            mkdir -p /tmp/old-apk
            unzip -p "$OLDZIP" MoboServer-v1.4.3.apk > /tmp/old-apk/old.apk
            "$BT/apksigner" verify --print-certs /tmp/old-apk/old.apk > /tmp/old-certs.txt
            NEW_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/apksigner.txt | head -1 | awk '{print $NF}')"
            OLD_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/old-certs.txt | head -1 | awk '{print $NF}')"
            test -n "$NEW_DIGEST"
            test "$NEW_DIGEST" = "$OLD_DIGEST"
            echo "Assinatura preservada: $NEW_DIGEST"
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "server_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Empacotar ZIP novo (sem sobrescrever publicação anterior)
        id: package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^versionName=//p' version.properties)"
          CODE="$(sed -n 's/^versionCode=//p' version.properties)"
          NAME="MoboServer-v${VERSION}-android-arm64"
          ZIP="releases_apk/${NAME}.zip"
          REVISION="$(git rev-parse HEAD)"
          APK_SHA="$(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)"
          SERVER_SHA="$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so | cut -d' ' -f1)"
          SOURCE_HASH="$(grep -a -o 'source [0-9a-f]\{64\}' /tmp/go-version.txt | head -1 | cut -d' ' -f2 || true)"
          WORK="$(mktemp -d)"
          cp android/app/build/outputs/apk/release/app-release.apk "$WORK/MoboServer-v${VERSION}.apk"
          cp dist/LEIA-ME.txt "$WORK/LEIA-ME.txt"
          cp docs/relatorio-1.4.4.md "$WORK/MUDANCAS-E-LIMITACOES.md"
          cp LICENSE "$WORK/LICENSE"
          {
            echo "MoboServer $VERSION (code $CODE) — Android ARM64"
            echo "Commit compilado: $REVISION"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "SHA-256 APK: $APK_SHA"
            echo "SHA-256 libmobosrv.so: $SERVER_SHA"
            echo "Hash de fonte do servidor: ${SOURCE_HASH:-ver -version no diagnóstico}"
            echo "Assinatura: mesma chave da linha 1.4.x; applicationId com.moboserver.app"
            echo "Testes: Go vet/test/selftests + JVM + assembleRelease + apksigner/aapt"
            echo "Não houve teste em aparelho físico nem cliente Minecraft nesta execução."
          } > "$WORK/BUILD-INFO.txt"
          printf '%s  MoboServer-v%s.apk\n' "$APK_SHA" "$VERSION" > "$WORK/SHA256SUMS.txt"
          mkdir -p releases_apk
          (cd "$WORK" && zip -q -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          if git cat-file -e "HEAD:$ZIP" 2>/dev/null; then
            EXISTING_SHA="$(git show "HEAD:$ZIP" | sha256sum | cut -d' ' -f1)"
            NEW_SHA="$(sha256sum "$ZIP" | cut -d' ' -f1)"
            if [ "$EXISTING_SHA" != "$NEW_SHA" ]; then
              echo "::error::$ZIP já existe com outro conteúdo. Não sobrescreva: bumps de versão/revisão são obrigatórios."
              exit 1
            fi
            echo "ZIP idêntico já publicado; nada a commitar."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          ZIP_SHA="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar ZIP em releases_apk (falha se não publicar)
        if: steps.package.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          REMOTE="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$REMOTE" != "$GITHUB_SHA" ]; then
            echo "::error::A branch avançou durante o build ($REMOTE != $GITHUB_SHA). Não aplique binário sobre outro código."
            exit 1
          fi
          git add -f "${{ steps.package.outputs.zip }}"
          git commit -m "build: ${{ steps.package.outputs.name }} [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Logs de diagnóstico (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            /tmp/go-*.log
            /tmp/selftest-*.log
            /tmp/build-host.log
            /tmp/gradle*.log
            /tmp/jvm-evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Build do MoboServer"
            echo ""
            echo "- Versão: \`${{ steps.package.outputs.version }}\`"
            echo "- ZIP: \`${{ steps.package.outputs.zip }}\`"
            echo "- SHA-256 ZIP: \`${{ steps.package.outputs.zip_sha }}\`"
            echo "- SHA-256 APK: \`${{ steps.package.outputs.apk_sha }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
