name: Build APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "releases_apk/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Servidor Go + APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: server/go.sum

      - name: "Servidor: dependencias, vet e self-test"
        working-directory: server
        run: |
          set -o pipefail
          {
            set -euo pipefail
            go mod tidy
            go vet ./...
            go test ./...
            go build -trimpath -o /tmp/mobosrv .
            /tmp/mobosrv -version
          # O self-test sobe um servidor real, carrega um mundo gerado, faz um
          # ping RakNet e desliga. Falha o build se qualquer parte quebrar.
          # Descoberta LAN: o payload do "Unconnected Pong" (o que o cliente
          # Bedrock le na aba LAN) e validado campo a campo, tanto na porta
          # padrao quanto em uma porta personalizada.
          /tmp/mobosrv -selftest -port 19132
          /tmp/mobosrv -selftest -port 19555
          # Tunel: relay local + cliente + ping RakNet pela porta publica.
          /tmp/mobosrv -selftest -port 19132 -selftest-tunnel
          } 2>&1 | tee /tmp/go-check.log

      - name: "Registrar evidencias dos testes"
        run: |
          set -uo pipefail
          mkdir -p docs
          {
            echo "MoboServer - evidencias automatizadas do ultimo build verde"
            echo "Commit: ${GITHUB_SHA}"
            echo "Data: $(date -u +%FT%TZ)"
            echo
            grep -E "^ok |selftest:|SELFTEST OK" /tmp/go-check.log 2>/dev/null || true
          } > docs/test-evidence.txt
          cat docs/test-evidence.txt

      - name: "Servidor: compilar para Android arm64"
        working-directory: server
        run: |
          set -euo pipefail
          OUT=../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          # GOOS=android e obrigatorio: um PIE compilado para linux pede o
          # loader do glibc (/lib/ld-linux-aarch64.so.1), que nao existe no
          # Android, e o exec falha com "error=2, No such file or directory".
          if ! CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" -o "$OUT/libmobosrv.so" . \
            > /tmp/go-arm64.log 2>&1; then
            echo "=== falha ao compilar para arm64 ==="
            cat /tmp/go-arm64.log
            mkdir -p ../.ci-logs && cp /tmp/go-arm64.log ../.ci-logs/go-arm64.log
            git -C .. add -f .ci-logs/go-arm64.log
            git -C .. -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci: log do build arm64 [skip ci]" || true
            git -C .. push || true
            exit 1
          fi
          # PIE linux aponta para o loader do glibc (inexistente no Android) e
          # tem TLS com alinhamento 8 (Bionic exige 64). Ver
          # scripts/patch-android-elf.py.
          python3 ../scripts/patch-android-elf.py "$OUT/libmobosrv.so"
          ls -lh "$OUT/libmobosrv.so"
          file "$OUT/libmobosrv.so"

      - name: "Servidor: validar o ELF para Android"
        run: |
          set -euo pipefail
          SO=android/app/src/main/jniLibs/arm64-v8a/libmobosrv.so
          python3 - "$SO" <<'PY'
          import struct, sys
          path = sys.argv[1]
          data = open(path, "rb").read()
          e_type, = struct.unpack_from("<H", data, 16)
          e_machine, = struct.unpack_from("<H", data, 18)
          e_phoff, = struct.unpack_from("<Q", data, 32)
          e_phentsize, e_phnum = struct.unpack_from("<HH", data, 54)
          interp = None
          dyn = None
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type, = struct.unpack_from("<I", data, off)
              p_offset, = struct.unpack_from("<Q", data, off + 8)
              p_filesz, = struct.unpack_from("<Q", data, off + 32)
              if p_type == 3:
                  interp = data[p_offset:p_offset + p_filesz].split(b"\0")[0].decode()
              if p_type == 2:
                  dyn = (p_offset, p_filesz)
          needed = []
          if dyn:
              o, size = dyn
              for j in range(o, o + size, 16):
                  tag, val = struct.unpack_from("<qQ", data, j)
                  if tag == 0:
                      break
                  if tag == 1:
                      needed.append(val)
          print("e_type", e_type, "machine", e_machine, "interp", interp, "needed", len(needed))
          if e_type != 3 or e_machine != 183:
              sys.exit("ELF nao e um PIE aarch64")
          if interp != "/system/bin/linker64":
              sys.exit(f"interpretador errado: {interp!r} (esperado /system/bin/linker64)")
          tls_align = None
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type, = struct.unpack_from("<I", data, off)
              if p_type == 7:
                  tls_align, = struct.unpack_from("<Q", data, off + 48)
          if needed:
              sys.exit("binario com dependencias dinamicas: nao roda em Android sem essas libs")
          if tls_align is not None and tls_align < 64:
              sys.exit(f"PT_TLS com alinhamento {tls_align}: Bionic exige >= 64")
          print("ELF ok: PIE aarch64, /system/bin/linker64, TLS", tls_align, "sem dependencias")
          PY
          echo "ELF ok"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Garantir Android SDK 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK nao encontrado no runner"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms"

      - name: Instalar Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Compilar APK release
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle.log

      - name: Diagnostico do build
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .ci-logs
          if [ -f /tmp/go-check.log ]; then
            cp /tmp/go-check.log .ci-logs/go-check.log
          fi
          if [ -f /tmp/gradle.log ]; then
            tail -c 200000 /tmp/gradle.log > .ci-logs/gradle.log
            grep -nE "e: file|error:|FAILURE|What went wrong|Caused by|Execution failed" .ci-logs/gradle.log | head -40 || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-logs/ || true
          git commit -m "ci: diagnostico do build [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning::apksigner nao encontrado, pulando verificacao de assinatura"
          fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmobosrv.so"
          echo "APK contem o servidor embutido."

      - name: Empacotar ZIP da release
        id: package
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName = ' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          NAME="MoboServer-v${VERSION}-android-arm64"
          WORK="$(mktemp -d)"
          cp android/app/build/outputs/apk/release/app-release.apk "$WORK/MoboServer-v${VERSION}.apk"
          cp dist/LEIA-ME.txt "$WORK/LEIA-ME.txt"
          cp LICENSE "$WORK/LICENSE"
          mkdir -p releases_apk
          rm -f "releases_apk/${NAME}.zip"
          (cd "$WORK" && zip -q -r "$GITHUB_WORKSPACE/releases_apk/${NAME}.zip" .)
          unzip -l "releases_apk/${NAME}.zip"
          echo "zip=releases_apk/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar ZIP em releases_apk
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.package.outputs.zip }}"
          git add -f docs/test-evidence.txt || true
          git add -f server/go.sum 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "build: ${{ steps.package.outputs.name }} [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Build do MoboServer"
            echo ""
            echo "- Zip: \`${{ steps.package.outputs.zip }}\`"
            echo "- Versao: \`${{ steps.package.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
