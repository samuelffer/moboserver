name: Build APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "releases_apk/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Servidor Go + APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Servidor: dependencias, vet e self-test
        working-directory: server
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go build -trimpath -o /tmp/mobosrv .
          /tmp/mobosrv -version
          # O self-test sobe um servidor real, carrega um mundo gerado, faz um
          # ping RakNet e desliga. Falha o build se qualquer parte quebrar.
          /tmp/mobosrv -selftest

      - name: Servidor: compilar para Android arm64
        working-directory: server
        run: |
          set -euo pipefail
          OUT=../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" -o "$OUT/libmobosrv.so" .
          ls -lh "$OUT/libmobosrv.so"
          file "$OUT/libmobosrv.so"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Garantir Android SDK 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK nao encontrado no runner"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms"

      - name: Instalar Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Compilar APK release
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning::apksigner nao encontrado, pulando verificacao de assinatura"
          fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmobosrv.so"
          echo "APK contem o servidor embutido."

      - name: Empacotar ZIP da release
        id: package
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName = ' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          NAME="MoboServer-v${VERSION}-android-arm64"
          WORK="$(mktemp -d)"
          cp android/app/build/outputs/apk/release/app-release.apk "$WORK/MoboServer-v${VERSION}.apk"
          cp dist/LEIA-ME.txt "$WORK/LEIA-ME.txt"
          cp LICENSE "$WORK/LICENSE"
          mkdir -p releases_apk
          rm -f "releases_apk/${NAME}.zip"
          (cd "$WORK" && zip -q -r "$GITHUB_WORKSPACE/releases_apk/${NAME}.zip" .)
          unzip -l "releases_apk/${NAME}.zip"
          echo "zip=releases_apk/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar ZIP em releases_apk
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.package.outputs.zip }}"
          git add -f server/go.sum 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "build: ${{ steps.package.outputs.name }} [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Build do MoboServer"
            echo ""
            echo "- Zip: \`${{ steps.package.outputs.zip }}\`"
            echo "- Versao: \`${{ steps.package.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
